name: Publish Oracle dashboard

# v2 (14 Aug 2026): TWO fixed publish moments per weekday - 13:00 and 19:00
# Europe/Paris - plus opportunistic publishing of off-schedule editions.
#
# The job polls every 30 minutes, every day. Two behaviours:
#   * SCHEDULED  - if the slot lands within 25 min before 12:59 or 18:59 Paris
#                  on a weekday, it sleeps to that exact second and publishes.
#                  DST-proof: the target is computed in Europe/Paris.
#   * OPPORTUNISTIC - any other slot peeks at the Drive folder and publishes
#                  immediately if the newest dashboard file is not the one
#                  recorded in the last [oracle-publish] commit. This covers
#                  special editions at any hour, any day, and doubles as
#                  catch-up if a scheduled slot was delayed or failed.
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Publish immediately, ignoring the schedule gate'
        type: boolean
        default: false

concurrency:
  group: oracle-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Gate (sleep to 13:00 / 19:00 Paris, or publish a new edition now)
        id: gate
        env:
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          if [ "${FORCE:-false}" = "true" ]; then
            echo "Forced publish (manual run)."
            echo "mode=publish" >> "$GITHUB_OUTPUT"
            echo "window=force" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          NOW=$(date +%s)
          DOW=$(TZ=Europe/Paris date +%u)          # 1-7, Mon-Sun
          TODAY=$(TZ=Europe/Paris date +%F)
          NOON=$(TZ=Europe/Paris date -d "$TODAY 12:59:00" +%s)
          EVE=$(TZ=Europe/Paris date -d "$TODAY 18:59:00" +%s)

          # Scheduled publish: weekdays only, within 25 min before a target.
          if [ "$DOW" -le 5 ]; then
            for T in "$NOON" "$EVE"; do
              DELTA=$((T - NOW))
              if [ "$DELTA" -gt 0 ] && [ "$DELTA" -le 1500 ]; then
                echo "Scheduled edition: sleeping ${DELTA}s to $(TZ=Europe/Paris date -d "@$T" '+%H:%M:%S %Z')..."
                sleep "$DELTA"
                echo "mode=publish" >> "$GITHUB_OUTPUT"
                echo "window=scheduled" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            done
          fi

          # Opportunistic: publish only if Drive holds an edition we never published.
          NEWEST=$(python3 scripts/fetch_latest.py --peek || true)
          if [ -z "$NEWEST" ]; then
            echo "Peek returned nothing (Drive listing unreachable). Skipping quietly."
            echo "mode=skip" >> "$GITHUB_OUTPUT"; exit 0
          fi
          LASTSRC=$(git log -1 --format=%s --grep='\[oracle-publish\]' -- site/index.html | sed -n 's/.*(\(.*\))$/\1/p' || true)
          echo "newest in Drive: '$NEWEST' | last published: '${LASTSRC:-none}'"
          if [ "$NEWEST" != "${LASTSRC:-}" ]; then
            echo "New edition detected - publishing now."
            echo "mode=publish" >> "$GITHUB_OUTPUT"
            echo "window=special" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing new. Skipping."
            echo "mode=skip" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch newest dashboard from Drive
        if: steps.gate.outputs.mode == 'publish'
        run: python3 scripts/fetch_latest.py

      - name: Commit and push
        if: steps.gate.outputs.mode == 'publish' && env.ORACLE_CHANGED == '1'
        run: |
          set -euo pipefail
          git config user.name  "oracle-publisher[bot]"
          git config user.email "oracle-publisher@users.noreply.github.com"
          git add site/index.html
          git commit -m "[oracle-publish] ${ORACLE_ASOF} - ${ORACLE_CHIP:-republish} (${ORACLE_SRC})"
          for i in 1 2 3; do
            git push && break
            echo "push failed (attempt $i), rebasing and retrying..."
            git pull --rebase && sleep 5
          done

      - name: Verify the deploy is live
        if: steps.gate.outputs.mode == 'publish' && env.ORACLE_CHANGED == '1' && env.ORACLE_CHIP != ''
        run: |
          set -euo pipefail
          URL="https://dreymoor-urea-oracle-cd-1ed87eec28.netlify.app"
          echo "Waiting for '$ORACLE_CHIP' to appear at $URL ..."
          for i in $(seq 1 32); do
            BODY=$(curl -fsSL --max-time 20 "$URL/?v=$RANDOM" || true)
            if printf '%s' "$BODY" | grep -qF "$ORACLE_CHIP"; then
              echo "Live: deploy verified after ~$((i * 15))s."
              exit 0
            fi
            sleep 15
          done
          echo "::error::DEPLOY NOT LIVE after 8 minutes - commit pushed but Netlify did not serve it."
          exit 1

      - name: Fail loudly if a scheduled edition had no fresh content
        if: steps.gate.outputs.mode == 'publish' && steps.gate.outputs.window == 'scheduled' && env.ORACLE_STALE == '1'
        run: |
          echo "::error::CONTENT STALE - newest Drive file is dated ${ORACLE_ASOF}, not today. The Claude analysis task likely failed; the site keeps the previous edition."
          exit 1
