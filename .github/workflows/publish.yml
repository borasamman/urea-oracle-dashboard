name: Publish Oracle dashboard

# All cron times are UTC. The three slots bracket 13:00 Europe/Paris in both
# summer (UTC+2) and winter (UTC+1); the job itself sleeps until exactly
# 12:59 Paris, so the publish moment is DST-proof. Later slots double as
# catch-up if an earlier one was delayed or failed.
on:
  schedule:
    - cron: '37 10 * * 1-5'
    - cron: '37 11 * * 1-5'
    - cron: '37 12 * * 1-5'
  workflow_dispatch:
    inputs:
      force:
        description: 'Publish immediately, ignoring the 13:00 Paris gate'
        type: boolean
        default: false

concurrency:
  group: oracle-publish
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Gate to 13:00 Paris (sleep / catch-up / skip)
        id: gate
        env:
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          NOW=$(date +%s)
          TARGET=$(TZ=Europe/Paris date -d "$(TZ=Europe/Paris date +%F) 12:59:00" +%s)
          TODAY=$(TZ=Europe/Paris date +%F)
          if [ "${FORCE:-false}" = "true" ]; then
            echo "Forced publish (manual run)."
            echo "mode=publish" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$NOW" -lt "$TARGET" ]; then
            DELTA=$((TARGET - NOW))
            if [ "$DELTA" -le 5460 ]; then
              echo "Sleeping $DELTA s until 12:59 Europe/Paris..."
              sleep "$DELTA"
              echo "mode=publish" >> "$GITHUB_OUTPUT"
            else
              echo "This slot is $DELTA s early - not today's publisher. Skipping."
              echo "mode=skip" >> "$GITHUB_OUTPUT"
            fi
          else
            LAST=$(git log -1 --format=%cI --grep='\[oracle-publish\]' -- site/index.html || true)
            LASTDAY=""
            if [ -n "$LAST" ]; then LASTDAY=$(TZ=Europe/Paris date -d "$LAST" +%F); fi
            if [ "$LASTDAY" = "$TODAY" ]; then
              echo "Already published today ($LAST). Nothing to do."
              echo "mode=skip" >> "$GITHUB_OUTPUT"
            else
              echo "Past 13:00 Paris with no publish yet today - catch-up publish now."
              echo "mode=publish" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Fetch newest dashboard from Drive
        if: steps.gate.outputs.mode == 'publish'
        run: python3 scripts/fetch_latest.py

      - name: Commit and push
        if: steps.gate.outputs.mode == 'publish' && env.ORACLE_CHANGED == '1'
        run: |
          set -euo pipefail
          git config user.name  "oracle-publisher[bot]"
          git config user.email "oracle-publisher@users.noreply.github.com"
          git add site/index.html
          git commit -m "[oracle-publish] ${ORACLE_ASOF} - ${ORACLE_CHIP:-republish} (${ORACLE_SRC})"
          for i in 1 2 3; do
            git push && break
            echo "push failed (attempt $i), rebasing and retrying..."
            git pull --rebase && sleep 5
          done

      - name: Verify the deploy is live
        if: steps.gate.outputs.mode == 'publish' && env.ORACLE_CHANGED == '1' && env.ORACLE_CHIP != ''
        run: |
          set -euo pipefail
          URL="https://dreymoor-urea-oracle-cd-1ed87eec28.netlify.app"
          echo "Waiting for '$ORACLE_CHIP' to appear at $URL ..."
          for i in $(seq 1 40); do
            BODY=$(curl -fsSL --max-time 30 "$URL/?v=$RANDOM" || true)
            if printf '%s' "$BODY" | grep -qF "$ORACLE_CHIP"; then
              echo "Live: deploy verified after ~$((i * 15))s."
              exit 0
            fi
            sleep 15
          done
          echo "::error::DEPLOY NOT LIVE after 10 minutes - commit pushed but Netlify did not serve it."
          exit 1

      - name: Fail loudly if today's content was missing
        if: steps.gate.outputs.mode == 'publish' && env.ORACLE_STALE == '1'
        run: |
          echo "::error::CONTENT STALE - newest Drive file is dated ${ORACLE_ASOF}, not today. The Claude analysis task likely failed; the site keeps the previous edition."
          exit 1
