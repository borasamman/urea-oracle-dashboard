<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f6f1f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#160f17" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<title>Phosphates Oracle — Dreymoor</title>
<style>
  body { margin: 0; background: #f6f1f6; color: #78687a; font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  @media (prefers-color-scheme: dark) { body { background: #160f17; color: #9c8a9e; } }
  #ld { padding: 48px 16px; text-align: center; }
  #ld a { color: inherit; }
</style>
</head>
<body>
<div id="ld">Loading the Phosphates Oracle…</div>
<script>
/* Phosphates Oracle shell (Nov 3 2026, Bora; same design as the other Oracle shells). The page itself lives in the database (Supabase table
   public.oracle_page_code, row "phosphates-page" = gzip + base64 of the full HTML), so edition updates and
   design changes need no GitHub commit. An optional row "phosphates-data" (the JSON data block) replaces the
   data embedded in the page when present - that is what the scheduled runs update.
   Record: claude/phosphates-oracle-live-2026-11-03.md */
(function () {
  var KEY = 'sb_publishable_P9Wm7Owg1tCMpl7Ws44L5w_YrGnwXs2';
  var URL = 'https://qexbmezexqcitprtdemt.supabase.co/rest/v1/oracle_page_code?select=name,code&name=in.(phosphates-page,phosphates-data)';
  var ld = document.getElementById('ld');
  function fail(e) {
    console.error('[phosphates] page not loaded', e);
    ld.innerHTML = 'The Phosphates Oracle could not be loaded just now. <a href="">Try again</a> or open the <a href="/">Urea Oracle</a>.';
  }
  fetch(URL, { headers: { apikey: KEY, Authorization: 'Bearer ' + KEY }, cache: 'no-store' })
    .then(function (r) { return r.ok ? r.json() : Promise.reject('HTTP ' + r.status); })
    .then(function (rows) {
      var page = null, data = null;
      (rows || []).forEach(function (r) { if (r.name === 'phosphates-page') page = r.code; if (r.name === 'phosphates-data') data = r.code; });
      if (!page) throw 'no page in database';
      var s = atob(page), bin = new Uint8Array(s.length);
      for (var i = 0; i < s.length; i++) bin[i] = s.charCodeAt(i);
      var stream = new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'));
      return new Response(stream).text().then(function (html) {
        if (data && data.trim().charAt(0) === '{') {
          var safe = data.replace(/<\//g, '<\\/');
          html = html.replace(/(<script id="oracle-data" type="application\/json">)[\s\S]*?(<\/script>)/,
            function (m, a, b) { return a + safe + b; });
        }
        document.open(); document.write(html); document.close();
      });
    })
    .catch(fail);
})();
</script>
</body>
</html>
